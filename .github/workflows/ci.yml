name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Guidelines & Deployment Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run verification test suite
        run: |
          python3 scripts/verify.py

      - name: Test sync.sh CLI commands
        run: |
          ./sync.sh list
          ./sync.sh find memory
          ./sync.sh query m-cargo-workspace
          ./sync.sh verify
